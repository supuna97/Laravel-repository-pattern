version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./my-app:/var/www
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./my-app:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    ports:
      - "3307:3306"

  redis:
    image: redis:alpine
    