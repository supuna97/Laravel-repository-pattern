version: "3.9"

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:dev
    env_file:
      - .env
    restart: always
    depends_on:
      - redis

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  redis:
    image: redis:alpine
    